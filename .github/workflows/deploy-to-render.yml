name: Deploy to Render

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies (optional)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ensure Render secrets are set
        run: |
          if [ -z "${{ secrets.RENDER_API_KEY }}" ]; then echo "Missing RENDER_API_KEY"; exit 1; fi
          if [ -z "${{ secrets.RENDER_SERVICE_ID }}" ]; then echo "Missing RENDER_SERVICE_ID"; exit 1; fi

      - name: Trigger a deploy on Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -e
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": true}')
          echo "Render API HTTP status: $status"
          if [ "$status" -ge 400 ]; then echo "Render deploy failed"; exit 1; fi
